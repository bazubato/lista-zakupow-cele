<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Moje listy</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Moje listy" />
<meta name="theme-color" content="#F6F2EA" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F6F2EA;
    --card-bg: #ffffff;
    --border: #E9E2D3;
    --text: #3A3226;
    --text-muted: #8A8272;
    --text-faint: #B0A98F;
    --input-bg: #F6F2EA;
    --tabs-bg: #EDE6D6;
    --row-bg: #F6F2EA;
    --item-border: #F0EBDF;
    --checkbox-border: #D8D0BC;
    --shadow: rgba(0,0,0,0.04);
    --shadow-strong: rgba(0,0,0,0.18);
  }
  body.dark {
    --bg: #211D17;
    --card-bg: #2B261E;
    --border: #3A3327;
    --text: #EFE8D9;
    --text-muted: #A69C87;
    --text-faint: #7A705E;
    --input-bg: #211D17;
    --tabs-bg: #1A1712;
    --row-bg: #211D17;
    --item-border: #35301F;
    --checkbox-border: #4A4230;
    --shadow: rgba(0,0,0,0.2);
    --shadow-strong: rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    transition: background .2s, color .2s;
  }
  body {
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    padding-top: calc(env(safe-area-inset-top) + 20px);
  }
  .wrap { max-width: 460px; margin: 0 auto; padding-bottom: 40px; }

  .theme-toggle {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text-muted); display: flex;
    align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .header-actions { display: flex; gap: 6px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(10px); background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 700;
    box-shadow: 0 6px 18px var(--shadow-strong); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 1000; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Zakładki typu listy */
  .tabs {
    display: flex; gap: 6px; background: var(--tabs-bg); padding: 4px;
    border-radius: 14px; margin-bottom: 18px;
  }
  .tab {
    flex: 1; border: none; background: transparent; padding: 10px 8px;
    border-radius: 11px; font-family: inherit; font-weight: 700; font-size: 13.5px;
    color: var(--text-muted); cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 6px; transition: background .15s, color .15s;
  }
  .tab.active { background: var(--card-bg); color: var(--text); box-shadow: 0 1px 2px var(--shadow); }
  .tab-edit-icon { display: inline-flex; margin-left: 5px; opacity: 0.55; }
  .tab-edit-input {
    flex: 1; min-width: 0; border: none; border-radius: 11px; background: var(--card-bg);
    color: var(--text); font-family: inherit; font-weight: 700; font-size: 13.5px;
    text-align: center; padding: 10px 8px; outline: 2px solid #8A9B6E;
  }

  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .icon-badge {
    width: 44px; height: 44px; border-radius: 16px; position: relative;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 1px 2px var(--shadow); transition: background .15s;
  }
  .badge-color-input {
    position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 16px;
    opacity: 0; border: none; padding: 0; cursor: pointer;
  }
  .badge-icon-edit {
    position: absolute; bottom: -5px; right: -5px; width: 18px; height: 18px;
    border-radius: 999px; border: 2px solid var(--bg); background: var(--card-bg);
    color: var(--text-muted); display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .badge-icon-edit svg { width: 9px; height: 9px; }
  h1 {
    font-family: 'Caveat', cursive;
    font-size: 38px; line-height: 1; margin: 0; font-weight: 700; color: var(--text);
  }
  .subtitle { font-size: 13px; color: var(--text-muted); margin: 8px 4px 20px; }

  .card {
    background: var(--card-bg); border-radius: 18px; border: 1px solid var(--border);
    box-shadow: 0 1px 3px var(--shadow); padding: 12px; margin-bottom: 16px;
  }
  .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  #text-input {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
    background: var(--input-bg); border: none; outline: none; color: var(--text);
    font-size: 15px; font-family: inherit;
  }
  #text-input::placeholder { color: var(--text-faint); }
  #text-input:focus { outline: 2px solid #8A9B6E; outline-offset: 1px; }

  #add-btn {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
    background: var(--text); color: var(--bg); border: none; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
  }
  #add-btn:active { transform: scale(0.95); }

  .options-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .opt-toggle {
    display: flex; align-items: center; gap: 6px; padding: 6px 11px;
    border-radius: 999px; border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); font-size: 12px; font-weight: 700; font-family: inherit;
    cursor: pointer; position: relative;
  }
  .opt-toggle.on { color: #fff; border-color: #D9A441; background: #D9A441; }
  .opt-toggle.date-on { color: #fff; border-color: #6B8CA6; background: #6B8CA6; }
  .opt-toggle .clear-x { display: flex; margin-left: 2px; background: none; border: none; color: inherit; cursor: pointer; padding: 0; }
  .date-overlay-input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: none; cursor: pointer; padding: 0;
  }
  .due-badge {
    display: inline-flex; align-items: center; gap: 4px; align-self: flex-start;
    font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--row-bg); color: var(--text-muted); position: relative;
  }
  .due-badge.soon { background: #FBEFD9; color: #A87A1F; }
  .due-badge.overdue { background: #F8E1DA; color: #C1440E; }
  .due-badge .clear-x { display: flex; margin-left: 2px; background: none; border: none; color: inherit; cursor: pointer; padding: 0; }

  .chips-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .chips-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); }
  .manage-btn {
    border: none; background: none; color: var(--text-muted); font-size: 12px;
    font-family: inherit; font-weight: 700; cursor: pointer; padding: 2px 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .manage-btn.on { color: #C1440E; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
    border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px;
  }
  .chip.active { color: #fff; border-color: transparent; }
  .chip .remove-x { display: flex; margin-left: 2px; }

  .new-cat-row { display: flex; gap: 6px; align-items: center; }
  .new-cat-input {
    padding: 6px 10px; border-radius: 999px; border: 1.5px dashed #C9A66B;
    background: var(--card-bg); font-size: 12px; font-family: inherit; outline: none;
    color: var(--text); width: 130px;
  }
  .new-cat-confirm {
    width: 26px; height: 26px; border-radius: 999px; border: none;
    background: #8A9B6E; color: #fff; display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .add-cat-chip {
    padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
    border: 1.5px dashed #C9A66B; background: transparent; color: #B4854A;
    cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 4px;
  }

  .cat-manage-list { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .cat-row {
    display: flex; align-items: center; gap: 8px; background: var(--row-bg);
    border-radius: 12px; padding: 8px 10px; transition: opacity .1s;
  }
  .cat-row.dragging { opacity: 0.35; }
  .drag-handle {
    cursor: grab; touch-action: none; color: var(--text-faint); display: flex;
    padding: 4px; flex-shrink: 0;
  }
  .cat-row .dot { width: 10px; height: 10px; }
  .cat-color-swatch {
    position: relative; width: 20px; height: 20px; border-radius: 999px;
    flex-shrink: 0; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
  }
  .cat-color-swatch input[type="color"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: none; padding: 0; cursor: pointer;
  }
  .cat-icon-btn {
    width: 20px; height: 20px; border-radius: 999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px dashed var(--border); background: var(--row-bg);
    color: var(--text-faint); cursor: pointer; padding: 0;
  }
  .cat-icon-btn.set { border-style: solid; border-color: transparent; color: #fff; }
  .icon-popover {
    background: var(--row-bg); border-radius: 12px; padding: 8px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    margin: -2px 0 4px;
  }
  .icon-popover button {
    width: 32px; height: 32px; border-radius: 9px; border: none;
    background: var(--card-bg); color: var(--text-muted); display: flex;
    align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-popover button.none-opt { color: #C1440E; font-size: 10px; font-weight: 800; }
  .cat-row-label { flex: 1; font-size: 13px; font-weight: 700; color: var(--text); cursor: text; }
  .cat-row-edit-input {
    flex: 1; min-width: 0; font-size: 13px; font-weight: 700; font-family: inherit;
    color: var(--text); border: none; border-bottom: 1.5px solid #8A9B6E;
    background: transparent; outline: none; padding: 0 0 2px;
  }
  .cat-row-edit-btn {
    background: none; border: none; cursor: pointer; padding: 2px;
    display: flex; flex-shrink: 0; color: var(--text-faint);
  }
  .cat-row-del {
    background: none; border: none; color: #C1440E; cursor: pointer;
    display: flex; padding: 4px; opacity: 0.7; flex-shrink: 0;
  }
  .drag-ghost {
    position: fixed; z-index: 999; pointer-events: none; display: flex;
    align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px; box-shadow: 0 6px 18px var(--shadow-strong);
    font-size: 13px; font-weight: 700; color: var(--text);
  }

  .tpl-list { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .tpl-row {
    display: flex; align-items: center; gap: 8px; background: var(--row-bg);
    border-radius: 12px; padding: 8px 10px;
  }
  .tpl-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tpl-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .tpl-count { font-size: 11px; color: var(--text-muted); }
  .tpl-apply-btn {
    background: #8A9B6E; color: #fff; border: none; border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 700; font-family: inherit;
    cursor: pointer; flex-shrink: 0;
  }
  .tpl-del-btn {
    background: none; border: none; color: #C1440E; cursor: pointer;
    display: flex; padding: 4px; opacity: 0.7; flex-shrink: 0;
  }
  .tpl-empty { font-size: 12.5px; color: var(--text-faint); padding: 4px 2px 10px; }
  .tpl-save-btn {
    padding: 8px 12px; border-radius: 12px; font-size: 12.5px; font-weight: 700;
    border: 1.5px dashed #C9A66B; background: transparent; color: #B4854A;
    cursor: pointer; font-family: inherit; display: flex; align-items: center;
    justify-content: center; gap: 6px; width: 100%; margin-top: 8px;
  }
  .tpl-save-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .tpl-save-input {
    flex: 1; min-width: 0; padding: 8px 12px; border-radius: 999px;
    border: 1.5px dashed #C9A66B; background: var(--card-bg); font-size: 12.5px;
    font-family: inherit; outline: none; color: var(--text);
  }

  .group { margin-bottom: 16px; }
  .group-label {
    display: flex; align-items: center; gap: 8px; margin: 0 4px 6px;
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .group-dot {
    width: 15px; height: 15px; border-radius: 999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }

  .list-card {
    background: var(--card-bg); border-radius: 18px; border: 1px solid var(--border);
    overflow: hidden; box-shadow: 0 1px 3px var(--shadow);
  }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 12px;
    border-bottom: 1px solid var(--item-border);
  }
  .item:last-child { border-bottom: none; }

  .check-btn {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 999px;
    border: 2px solid var(--checkbox-border); background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .item-text { flex: 1; font-size: 15px; word-break: break-word; color: var(--text); cursor: text; }
  .item-text.done { color: var(--text-faint); text-decoration: line-through; }
  .item-edit-input {
    flex: 1; min-width: 0; font-size: 15px; font-family: inherit; color: var(--text);
    border: none; border-bottom: 1.5px solid #8A9B6E; background: transparent;
    outline: none; padding: 0 0 2px;
  }
  .edit-btn {
    background: none; border: none; cursor: pointer; padding: 2px;
    display: flex; flex-shrink: 0; color: var(--text-faint);
  }

  /* Zmiana kategorii pojedynczego elementu: kolorowa kropka z NATYWNYM selectem
     nałożonym niewidocznie na wierzch — otwiera systemowy picker telefonu,
     więc menu nigdy nie jest "obcięte" przez kartę z overflow:hidden. */
  .cat-picker { position: relative; width: 22px; height: 22px; flex-shrink: 0; }
  .cat-dot-visual {
    width: 22px; height: 22px; border-radius: 999px; pointer-events: none;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .cat-dot-visual::after {
    content: ""; width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.85);
  }
  .cat-dot-visual.has-icon::after { content: none; }
  .cat-select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: none; cursor: pointer; font-size: 16px;
  }

  .del-btn {
    background: none; border: none; color: #C1440E; cursor: pointer;
    padding: 4px; display: flex; opacity: 0.6; flex-shrink: 0;
  }

  .item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .star-btn {
    background: none; border: none; cursor: pointer; padding: 2px;
    display: flex; flex-shrink: 0; color: var(--checkbox-border);
  }
  .star-btn.on { color: #D9A441; }

  .empty { text-align: center; padding: 60px 0; color: var(--text-faint); }
  .empty svg { opacity: 0.5; margin-bottom: 8px; }
  .empty p { font-size: 14px; margin: 0; }

  .clear-btn {
    display: flex; align-items: center; gap: 6px; justify-content: center;
    margin: 20px auto 0; background: none; border: none; color: var(--text-muted);
    font-size: 14px; font-family: inherit; cursor: pointer; padding: 6px;
  }

  .stats-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1100;
    display: none; align-items: flex-end; justify-content: center; padding: 0;
  }
  .stats-overlay.show { display: flex; }
  .stats-card {
    background: var(--card-bg); width: 100%; max-width: 460px;
    border-radius: 24px 24px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom) + 24px);
    max-height: 82vh; overflow-y: auto; box-shadow: 0 -8px 30px var(--shadow-strong);
  }
  .stats-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .stats-title { font-family: 'Caveat', cursive; font-size: 28px; font-weight: 700; color: var(--text); }
  .stats-close {
    width: 32px; height: 32px; border-radius: 999px; border: none;
    background: var(--row-bg); color: var(--text-muted); display: flex;
    align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .stats-hero {
    text-align: center; padding: 16px 0 20px; border-bottom: 1px solid var(--item-border);
    margin-bottom: 16px;
  }
  .stats-hero-number { font-family: 'Caveat', cursive; font-size: 52px; font-weight: 700; line-height: 1; color: #8A9B6E; }
  .stats-hero-label { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .stats-section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); margin: 0 0 8px 2px; }
  .stats-row { margin-bottom: 14px; }
  .stats-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .stats-row-label { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: var(--text); }
  .stats-row-nums { font-size: 12px; color: var(--text-muted); font-weight: 700; }
  .stats-bar-track { height: 8px; border-radius: 999px; background: var(--row-bg); overflow: hidden; }
  .stats-bar-fill { height: 100%; border-radius: 999px; transition: width .3s; }
  .stats-month-box {
    background: var(--row-bg); border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px; margin-top: 4px;
  }
  .stats-month-number { font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; color: #6B8CA6; }
  .stats-month-label { font-size: 12.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>

    <div class="header">
      <div class="icon-badge" id="icon-badge"></div>
      <h1 id="title">Moje listy</h1>
      <div style="flex:1"></div>
      <div class="header-actions">
        <button class="theme-toggle" id="stats-btn" aria-label="Statystyki"></button>
        <button class="theme-toggle" id="theme-toggle" aria-label="Przełącz motyw"></button>
      </div>
    </div>
    <div id="type-icon-popover"></div>
    <p class="subtitle" id="subtitle"></p>

    <div class="card">
      <div class="add-row">
        <input id="text-input" placeholder="" />
        <button id="add-btn" aria-label="Dodaj">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="options-row" id="options-row"></div>
      <div class="chips-header">
        <span class="chips-title">Kategorie</span>
        <button class="manage-btn" id="manage-btn"></button>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="card">
      <div class="chips-header">
        <span class="chips-title">Szablony</span>
      </div>
      <div id="templates-panel"></div>
    </div>

    <div id="content"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="stats-overlay" id="stats-overlay">
    <div class="stats-card" id="stats-card"></div>
  </div>

<script>
  const TYPES = {
    zakupy: {
      label: "Zakupy",
      title: "Lista zakupów",
      badgeColor: "#8A9B6E",
      placeholder: "np. mleko, ręcznik papierowy...",
      emptyMain: "Twoja lista jest pusta — dodaj pierwszą rzecz.",
      emptyDone: "Wszystko odhaczone. Można iść do kasy.",
      remainingLabel: "Zostało do kupienia",
      emptyList: "Brak produktów na liście",
      icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6F2EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h9.2a2 2 0 0 0 2-1.6L22 6H6"/><path d="M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/><path d="M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>`,
      defaultCats: [
        { id: "spozywcze", label: "Spożywcze", color: "#8A9B6E" },

    const soonISO = soon.getFullYear() + "-" + String(soon.getMonth()+1).padStart(2,"0") + "-" + String(soon.getDate()).padStart(2,"0");

    hero.className = "stats-hero";

    statsCardEl.appendChild(hero);

      const row = document.createElement("div");
      row.className = "stats-row";

  let editingTypeLabel = null;

  function renderTabs() {
    tabsEl.innerHTML = "";
    Object.keys(TYPES).forEach(typeId => {
      if (editingTypeLabel === typeId) {
        const input = document.createElement("input");
        input.className = "tab-edit-input";
        input.value = getTypeName(typeId);
        const commit = () => {
          const val = input.value.trim();
          if (val) { typeLabels[typeId] = val; saveTypeLabels(); }
          editingTypeLabel = null;
          renderAll();
        };
        input.addEventListener("keydown", e => {
          if (e.key === "Enter") commit();
          if (e.key === "Escape") { editingTypeLabel = null; renderTabs(); }
        });
        input.addEventListener("blur", commit);
        tabsEl.appendChild(input);
        setTimeout(() => { input.focus(); input.select(); }, 0);
        return;
      }

      const btn = document.createElement("button");
      btn.className = "tab" + (typeId === activeType ? " active" : "");
      const labelSpan = document.createElement("span");
      labelSpan.textContent = getTypeName(typeId);
      btn.appendChild(labelSpan);

        const editIcon = document.createElement("span");
        editIcon.className = "tab-edit-icon";
        editIcon.innerHTML = pencilSvg();
        editIcon.onclick = (e) => {
          e.stopPropagation();
          editingTypeLabel = typeId;
          renderTabs();
        };
        btn.appendChild(editIcon);

        activeType = typeId;

        addingCategory = false;
        addingTemplate = false;
        editingCatId = null;

        renderAll();
      };

    colorInput.setAttribute("aria-label", "Zmień kolor listy");

      if (!typeStyles[activeType]) typeStyles[activeType] = {};

    iconBadgeEl.appendChild(colorInput);

    iconEditBtn.className = "badge-icon-edit";

    optionsRowEl.innerHTML = "";

    const starBtn = document.createElement("button");
    starBtn.className = "opt-toggle" + (newPriority ? " on" : "");
    starBtn.innerHTML = `${starSvg(newPriority)} Priorytet`;
    starBtn.onclick = () => { newPriority = !newPriority; renderOptions(); };
    optionsRowEl.appendChild(starBtn);

    const dateOpt = document.createElement("div");
    dateOpt.className = "opt-toggle" + (newDueDate ? " date-on" : "");
    dateOpt.style.position = "relative";
    if (newDueDate) {
      dateOpt.innerHTML = `${calendarSvg()} ${formatShortDate(newDueDate)}`;
      const clearBtn = document.createElement("button");
      clearBtn.className = "clear-x";
      clearBtn.innerHTML = xSvg("currentColor", 11);
      clearBtn.onclick = (e) => { e.stopPropagation(); newDueDate = null; renderOptions(); };
      dateOpt.appendChild(clearBtn);
    } else {
      dateOpt.innerHTML = `${calendarSvg()} Termin`;
      const dateInput = document.createElement("input");
      dateInput.type = "date";
      dateInput.className = "date-overlay-input";
      dateInput.onchange = () => {
        if (dateInput.value) { newDueDate = dateInput.value; renderOptions(); }
      };
      dateOpt.appendChild(dateInput);
    }
    optionsRowEl.appendChild(dateOpt);
  }

  function renderManageBtn() {
    manageBtnEl.className = "manage-btn" + (manageMode ? " on" : "");
    manageBtnEl.innerHTML = manageMode
      ? `${xSvg("#C1440E", 12)} Gotowe`
      : `${pencilSvg()} Zarządzaj`;
    manageBtnEl.onclick = () => {
      manageMode = !manageMode;
      addingCategory = false;
      editingCatId = null;
      renderChips();
    };
  }

  function renderChips() {
    chipsEl.innerHTML = "";
    const cats = allCats[activeType];

    if (manageMode) {
      renderManageList();
    } else {
      cats.forEach(cat => {
        const chip = document.createElement("button");
        chip.className = "chip" + (cat.id === activeCategory ? " active" : "");
        if (cat.id === activeCategory) {
          chip.style.background = cat.color;
          chip.style.borderColor = cat.color;
        }
        chip.innerHTML = `${catIconSvg(cat.icon, 13)}<span>${cat.label}</span>`;
        chip.onclick = () => { activeCategory = cat.id; renderChips(); };
        chipsEl.appendChild(chip);
      });
    }

    if (manageMode) {
      if (addingCategory) {
        const row = document.createElement("div");
        row.className = "new-cat-row";
        row.style.marginTop = "8px";
        const input = document.createElement("input");
        input.className = "new-cat-input";
        input.placeholder = "Nazwa kategorii";
        const confirm = document.createElement("button");
        confirm.className = "new-cat-confirm";
        confirm.innerHTML = checkSvg();
        const commit = () => {
          const val = input.value.trim();
          if (val) {
            const id = "cat-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
            allCats[activeType].push({ id, label: val, color: nextColor() });
            saveCats();
          }
          addingCategory = false;
          renderChips();
        };
        confirm.onclick = commit;
        input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
        row.appendChild(input);
        row.appendChild(confirm);
        chipsEl.appendChild(row);
        setTimeout(() => input.focus(), 0);
      } else {
        const addChip = document.createElement("button");
        addChip.className = "add-cat-chip";
        addChip.style.marginTop = "8px";
        addChip.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Nowa kategoria`;
        addChip.onclick = () => { addingCategory = true; renderChips(); };
        chipsEl.appendChild(addChip);
      }
    }

    if (!cats.find(c => c.id === activeCategory)) {
      activeCategory = cats[0]?.id || null;
    }
  }

  function makeColorSwatch(cat) {
    const swatch = document.createElement("div");
    swatch.className = "cat-color-swatch";
    swatch.style.background = cat.color;
    const colorInput = document.createElement("input");
    colorInput.type = "color";
    colorInput.value = cat.color;
    colorInput.setAttribute("aria-label", "Zmień kolor kategorii");
    colorInput.onchange = () => {
      cat.color = colorInput.value;
      swatch.style.background = cat.color;
      saveCats();
      renderList(); renderHeader();
    };
    swatch.appendChild(colorInput);
    return swatch;
  }

  let editingCatId = null;
  let iconPickerCatId = null;

  function buildCatRow(cat, isDragging, container) {
    const row = document.createElement("div");
    row.className = "cat-row" + (isDragging ? " dragging" : "");
    row.dataset.catId = cat.id;

    const handle = document.createElement("div");
    handle.className = "drag-handle";
    handle.innerHTML = handleSvg();
    handle.onpointerdown = (e) => startDrag(e, cat.id);
    row.appendChild(handle);

    const dot = makeColorSwatch(cat);
    row.appendChild(dot);

    const iconBtn = document.createElement("button");
    iconBtn.className = "cat-icon-btn" + (cat.icon ? " set" : "");
    iconBtn.setAttribute("aria-label", "Zmień ikonę kategorii");
    if (cat.icon) {
      iconBtn.style.background = cat.color;
      iconBtn.innerHTML = catIconSvg(cat.icon, 12);
    } else {
      iconBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`;
    }
    iconBtn.onclick = () => {
      iconPickerCatId = iconPickerCatId === cat.id ? null : cat.id;
      renderManageListPreservingDrag();
    };
    row.appendChild(iconBtn);

    if (editingCatId === cat.id) {
      const input = document.createElement("input");
      input.className = "cat-row-edit-input";
      input.value = cat.label;
      const commit = () => {
        const val = input.value.trim();
        if (val) cat.label = val;
        editingCatId = null;
        saveCats();
        renderManageListPreservingDrag();
        renderList(); renderHeader();
      };
      const cancel = () => { editingCatId = null; renderManageListPreservingDrag(); };
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") cancel();
      });
      input.addEventListener("blur", commit);
      row.appendChild(input);
      setTimeout(() => { input.focus(); input.select(); }, 0);
    } else {
      const label = document.createElement("span");
      label.className = "cat-row-label";
      label.textContent = cat.label;
      label.onclick = () => { editingCatId = cat.id; renderManageListPreservingDrag(); };
      row.appendChild(label);

      const editBtn = document.createElement("button");
      editBtn.className = "cat-row-edit-btn";
      editBtn.innerHTML = pencilSvg();
      editBtn.setAttribute("aria-label", "Zmień nazwę kategorii");
      editBtn.onclick = () => { editingCatId = cat.id; renderManageListPreservingDrag(); };
      row.appendChild(editBtn);
    }

    const del = document.createElement("button");
    del.className = "cat-row-del";
    del.innerHTML = xSvg("#C1440E", 15);
    del.onclick = () => deleteCategory(cat.id);
    row.appendChild(del);

    container.appendChild(row);

    if (iconPickerCatId === cat.id) {
      const popover = document.createElement("div");
      popover.className = "icon-popover";

      const noneBtn = document.createElement("button");
      noneBtn.className = "none-opt";
      noneBtn.textContent = "Brak";
      noneBtn.onclick = () => {
        cat.icon = null;
        iconPickerCatId = null;
        saveCats();
        renderManageListPreservingDrag();
        renderList(); renderHeader();
      };
      popover.appendChild(noneBtn);

      Object.keys(CAT_ICONS).forEach(iconId => {
        const btn = document.createElement("button");
        btn.innerHTML = catIconSvg(iconId, 16);
        btn.onclick = () => {
          cat.icon = iconId;
          iconPickerCatId = null;
          saveCats();
          renderManageListPreservingDrag();
          renderList(); renderHeader();
        };
        popover.appendChild(btn);
      });

      container.appendChild(popover);
    }
  }

  function renderManageList() {
    const list = document.createElement("div");
    list.className = "cat-manage-list";
    allCats[activeType].forEach(cat => {
      buildCatRow(cat, false, list);
    });
    chipsEl.appendChild(list);
  }

  let dragState = null;
  let editingId = null;

  function startDrag(e, catId) {
    e.preventDefault();
    const cats = allCats[activeType];
    const row = chipsEl.querySelector(`.cat-row[data-cat-id="${catId}"]`);
    const cat = cats.find(c => c.id === catId);
    if (!row || !cat) return;

    row.classList.add("dragging");

    const ghost = document.createElement("div");
    ghost.className = "drag-ghost";
    ghost.innerHTML = `<span class="group-dot" style="background:${cat.color}">${catIconSvg(cat.icon, 9)}</span>${cat.label}`;
    document.body.appendChild(ghost);
    positionGhost(ghost, e.clientX, e.clientY);

    dragState = { catId, ghost };

    const onMove = (ev) => {
      ev.preventDefault();
      positionGhost(ghost, ev.clientX, ev.clientY);
      const rowEl = chipsEl.querySelector(`.cat-row[data-cat-id="${dragState.catId}"]`);
      if (rowEl) rowEl.style.pointerEvents = "none";
      const overRow = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".cat-row");
      if (rowEl) rowEl.style.pointerEvents = "";
      if (overRow && overRow.dataset.catId !== dragState.catId) {
        const list = allCats[activeType];
        const fromIdx = list.findIndex(c => c.id === dragState.catId);
        const toIdx = list.findIndex(c => c.id === overRow.dataset.catId);
        if (fromIdx !== -1 && toIdx !== -1) {
          const [moved] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, moved);
          renderManageListPreservingDrag();
        }
      }
    };

    const onUp = () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      ghost.remove();
      const rowEl = chipsEl.querySelector(`.cat-row[data-cat-id="${dragState?.catId}"]`);
      if (rowEl) rowEl.classList.remove("dragging");
      dragState = null;
      saveCats();
    };

    document.addEventListener("pointermove", onMove, { passive: false });
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  function positionGhost(ghost, x, y) {
    ghost.style.left = (x - 20) + "px";
    ghost.style.top = (y - 18) + "px";
  }

  function renderManageListPreservingDrag() {
    const listEl = chipsEl.querySelector(".cat-manage-list");
    if (!listEl) return;
    listEl.innerHTML = "";
    allCats[activeType].forEach(cat => {
      const isDragging = dragState && dragState.catId === cat.id;
      buildCatRow(cat, isDragging, listEl);
    });
  }

  function deleteCategory(catId) {
    const cats = allCats[activeType];
    if (cats.length <= 1) return; // musi zostać co najmniej jedna kategoria
    const remaining = cats.filter(c => c.id !== catId);
    const fallbackId = remaining[0].id;
    // przenieś elementy usuwanej kategorii do pierwszej pozostałej
    allItems[activeType] = allItems[activeType].map(it =>
      it.category === catId ? { ...it, category: fallbackId } : it
    );
    allCats[activeType] = remaining;
    saveCats(); saveItems();
    renderChips(); renderList(); renderHeader();
  }

  function renderList() {
    const t = TYPES[activeType];
    const items = allItems[activeType];
    const cats = allCats[activeType];
    contentEl.innerHTML = "";

    const sortedItems = [...items].sort((a, b) => {
      const p = (!!b.priority) - (!!a.priority);
      if (p !== 0) return p;
      const aDate = a.dueDate || "9999-99-99";
      const bDate = b.dueDate || "9999-99-99";
      return aDate < bDate ? -1 : aDate > bDate ? 1 : 0;
    });

    const groups = cats.map(cat => ({
      ...cat,
      items: sortedItems.filter(it => it.category === cat.id)
    })).filter(g => g.items.length > 0);

    if (groups.length === 0) {
      contentEl.innerHTML = `<div class="empty">${emptySvg()}<p>${t.emptyList}</p></div>`;
      return;
    }

    groups.forEach(group => {
      const groupDiv = document.createElement("div");
      groupDiv.className = "group";

      const label = document.createElement("div");
      label.className = "group-label";
      label.innerHTML = `<span class="group-dot" style="background:${group.color}">${catIconSvg(group.icon, 9)}</span>${group.label}`;
      groupDiv.appendChild(label);

      const listCard = document.createElement("div");
      listCard.className = "list-card";

      group.items.forEach(item => {
        const row = document.createElement("div");
        row.className = "item";

        const checkBtn = document.createElement("button");
        checkBtn.className = "check-btn";
        checkBtn.style.borderColor = item.done ? group.color : "#D8D0BC";
        checkBtn.style.background = item.done ? group.color : "transparent";
        checkBtn.innerHTML = item.done ? checkSvg() : "";
        checkBtn.onclick = () => {
          item.done = !item.done;
          item.completedAt = item.done ? new Date().toISOString() : null;
          saveItems(); renderList(); renderHeader();
        };

        const body = document.createElement("div");
        body.className = "item-body";

        if (editingId === item.id) {
          const input = document.createElement("input");
          input.className = "item-edit-input";
          input.value = item.text;
          const commit = () => {
            const val = input.value.trim();
            if (val) item.text = val;
            editingId = null;
            saveItems(); renderList();
          };
          const cancel = () => { editingId = null; renderList(); };
          input.addEventListener("keydown", e => {
            if (e.key === "Enter") commit();
            if (e.key === "Escape") cancel();
          });
          input.addEventListener("blur", commit);
          body.appendChild(input);
          setTimeout(() => { input.focus(); input.select(); }, 0);
        } else {
          const text = document.createElement("span");
          text.className = "item-text" + (item.done ? " done" : "");
          text.textContent = item.text;
          text.onclick = () => { editingId = item.id; renderList(); };
          body.appendChild(text);
        }

        if (item.dueDate) {
          const status = item.done ? "normal" : dueStatus(item.dueDate);
          const badge = document.createElement("div");
          badge.className = "due-badge" + (status !== "normal" ? " " + status : "");
          badge.innerHTML = `${calendarSvg(11)}${status === "overdue" ? " Po terminie:" : ""} ${formatShortDate(item.dueDate)}`;
          const dateInput = document.createElement("input");
          dateInput.type = "date";
          dateInput.className = "date-overlay-input";
          dateInput.value = item.dueDate;
          dateInput.onchange = () => {
            if (dateInput.value) { item.dueDate = dateInput.value; saveItems(); renderList(); }
          };
          badge.appendChild(dateInput);
          const clearBtn = document.createElement("button");
          clearBtn.className = "clear-x";
          clearBtn.innerHTML = xSvg("currentColor", 10);
          clearBtn.onclick = (e) => {
            e.stopPropagation();
            item.dueDate = null;
            saveItems(); renderList();
          };
          badge.appendChild(clearBtn);
          body.appendChild(badge);
        } else {
          const addDate = document.createElement("div");
          addDate.className = "due-badge";
          addDate.style.color = "#B0A98F";
          addDate.innerHTML = `${calendarSvg(11)} Dodaj termin`;
          const dateInput = document.createElement("input");
          dateInput.type = "date";
          dateInput.className = "date-overlay-input";
          dateInput.onchange = () => {
            if (dateInput.value) { item.dueDate = dateInput.value; saveItems(); renderList(); }
          };
          addDate.appendChild(dateInput);
          body.appendChild(addDate);
        }

        const editBtn = document.createElement("button");
        editBtn.className = "edit-btn";
        editBtn.setAttribute("aria-label", "Edytuj");
        editBtn.innerHTML = pencilSvg();
        editBtn.onclick = () => { editingId = item.id; renderList(); };

        const starBtn = document.createElement("button");
        starBtn.className = "star-btn" + (item.priority ? " on" : "");
        starBtn.setAttribute("aria-label", "Priorytet");
        starBtn.innerHTML = starSvg(!!item.priority, 16);
        starBtn.onclick = () => {
          item.priority = !item.priority;
          saveItems(); renderList();
        };

        // Zmiana kategorii — natywny <select> nałożony na kolorową kropkę.
        // Otwiera systemowy picker telefonu, więc działa niezawodnie na mobile.
        const picker = document.createElement("div");
        picker.className = "cat-picker";
        const dotVisual = document.createElement("div");
        dotVisual.className = "cat-dot-visual" + (group.icon ? " has-icon" : "");
        dotVisual.style.background = group.color;
        if (group.icon) dotVisual.innerHTML = catIconSvg(group.icon, 11);
        const select = document.createElement("select");
        select.className = "cat-select";
        select.setAttribute("aria-label", "Zmień kategorię");
        cats.forEach(cat => {
          const opt = document.createElement("option");
          opt.value = cat.id;
          opt.textContent = cat.label;
          if (cat.id === item.category) opt.selected = true;
          select.appendChild(opt);
        });
        select.onchange = () => {
          item.category = select.value;
          saveItems(); renderList(); renderHeader();
        };
        picker.appendChild(dotVisual);
        picker.appendChild(select);

        const delBtn = document.createElement("button");
        delBtn.className = "del-btn";
        delBtn.innerHTML = xSvg();
        delBtn.onclick = () => {
          allItems[activeType] = allItems[activeType].filter(it => it.id !== item.id);
          saveItems(); renderList(); renderHeader();
        };

        row.appendChild(checkBtn);
        row.appendChild(body);
        row.appendChild(editBtn);
        row.appendChild(starBtn);
        row.appendChild(picker);
        row.appendChild(delBtn);
        listCard.appendChild(row);
      });

      groupDiv.appendChild(listCard);
      contentEl.appendChild(groupDiv);
    });

    if (items.some(it => it.done)) {
      const clearBtn = document.createElement("button");
      clearBtn.className = "clear-btn";
      clearBtn.innerHTML = `${trashSvg()} Usuń odhaczone (${items.filter(it => it.done).length})`;
      clearBtn.onclick = () => {
        allItems[activeType] = allItems[activeType].filter(it => !it.done);
        saveItems(); renderList(); renderHeader();
      };
      contentEl.appendChild(clearBtn);
    }
  }

  function addItem() {
    const val = inputEl.value.trim();
    if (!val || !activeCategory) return;
    allItems[activeType].push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      text: val,
      category: activeCategory,
      done: false,
      priority: newPriority,
      dueDate: newDueDate
    });
    inputEl.value = "";
    newPriority = false;
    newDueDate = null;
    saveItems();
    renderOptions(); renderList(); renderHeader();
    inputEl.focus();
  }

  document.getElementById("add-btn").onclick = addItem;
  inputEl.addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });

  function renderTemplatesPanel() {
    templatesPanelEl.innerHTML = "";
    const templates = allTemplates[activeType];

    if (templates.length === 0) {
      const empty = document.createElement("div");
      empty.className = "tpl-empty";
      empty.textContent = "Brak zapisanych szablonów dla tej listy.";
      templatesPanelEl.appendChild(empty);
    } else {
      const list = document.createElement("div");
      list.className = "tpl-list";
      templates.forEach(tpl => {
        const row = document.createElement("div");
        row.className = "tpl-row";

        const info = document.createElement("div");
        info.className = "tpl-info";
        const name = document.createElement("span");
        name.className = "tpl-name";
        name.textContent = tpl.name;
        const count = document.createElement("span");
        count.className = "tpl-count";
        count.textContent = `${tpl.items.length} ${tpl.items.length === 1 ? "pozycja" : "pozycji"}`;
        info.appendChild(name);
        info.appendChild(count);
        row.appendChild(info);

        const applyBtn = document.createElement("button");
        applyBtn.className = "tpl-apply-btn";
        applyBtn.textContent = "Dodaj";
        applyBtn.onclick = () => applyTemplate(tpl);
        row.appendChild(applyBtn);

        const delBtn = document.createElement("button");
        delBtn.className = "tpl-del-btn";
        delBtn.innerHTML = xSvg("#C1440E", 15);
        delBtn.onclick = () => deleteTemplate(tpl.id);
        row.appendChild(delBtn);

        list.appendChild(row);
      });
      templatesPanelEl.appendChild(list);
    }

    if (addingTemplate) {
      const row = document.createElement("div");
      row.className = "tpl-save-row";
      const input = document.createElement("input");
      input.className = "tpl-save-input";
      input.placeholder = "Nazwa szablonu, np. Cotygodniowe zakupy";
      const confirm = document.createElement("button");
      confirm.className = "new-cat-confirm";
      confirm.innerHTML = checkSvg();
      const commit = () => {
        const val = input.value.trim();
        if (val) saveCurrentAsTemplate(val);
        addingTemplate = false;
        renderTemplatesPanel();
      };
      confirm.onclick = commit;
      input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); if (e.key === "Escape") { addingTemplate = false; renderTemplatesPanel(); } });
      row.appendChild(input);
      row.appendChild(confirm);
      templatesPanelEl.appendChild(row);
      setTimeout(() => input.focus(), 0);
    } else {
      const saveBtn = document.createElement("button");
      saveBtn.className = "tpl-save-btn";
      saveBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Zapisz obecną listę jako szablon`;
      saveBtn.onclick = () => {
        if (allItems[activeType].length === 0) {
          showToast("Lista jest pusta — nie ma co zapisać");
          return;
        }
        addingTemplate = true;
        renderTemplatesPanel();
      };
      templatesPanelEl.appendChild(saveBtn);
    }
  }

  function saveCurrentAsTemplate(name) {
    const items = allItems[activeType].map(it => ({
      text: it.text,
      category: it.category,
      priority: !!it.priority
    }));
    allTemplates[activeType].push({
      id: "tpl-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      name,
      items
    });
    saveTemplates();
    showToast(`Zapisano szablon „${name}"`);
  }

  function applyTemplate(tpl) {
    const validCatIds = allCats[activeType].map(c => c.id);
    const fallbackCat = validCatIds[0];
    tpl.items.forEach(it => {
      allItems[activeType].push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2, 4),
        text: it.text,
        category: validCatIds.includes(it.category) ? it.category : fallbackCat,
        done: false,
        priority: !!it.priority,
        dueDate: null
      });
    });
    saveItems();
    renderList(); renderHeader();
    showToast(`Dodano szablon „${tpl.name}"`);
  }

  function deleteTemplate(id) {
    allTemplates[activeType] = allTemplates[activeType].filter(t => t.id !== id);
    saveTemplates();
    renderTemplatesPanel();
  }

  function renderAll() {
    renderTabs();
    renderHeader();
    renderOptions();
    renderManageBtn();
    renderChips();
    renderTemplatesPanel();
    renderList();
  }

  renderAll();
</script>
</body>
</html>
